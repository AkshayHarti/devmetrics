[project]
name = "devmetrics"
version = "0.1.0"
requires-python = ">=3.11"
description = "Development metrics collected passively from omniroute and agent session logs"
readme = "README.md"

[project.scripts]
devmetrics = "devmetrics.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "devmetrics/__init__.py"
